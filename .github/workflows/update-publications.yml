# Refreshes data/publications.json from the NASA/ADS library every Monday.
# Needs a repository secret called ADS_API_TOKEN
# (Settings > Secrets and variables > Actions > New repository secret),
# with a token from https://ui.adsabs.harvard.edu/user/settings/token
name: Update publications

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications from ADS
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python scripts/update_publications.py

      - name: Commit if the list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/publications.js
          if git diff --cached --quiet; then
            echo "No new publications."
          else
            git commit -m "Update publications from ADS"
            git push
          fi
